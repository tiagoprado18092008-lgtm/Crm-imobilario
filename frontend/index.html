<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1B2B4B" />
    <meta name="description" content="AlphaCRM — CRM de vendas e operações da AlphaScale AI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AlphaCRM" />
    <link rel="manifest" href="/manifest.json" />
    <title>AlphaCRM</title>    <script>
      (function () {
        try {
          var stored = localStorage.getItem('alphacrm-theme');
          var theme = (stored === 'light' || stored === 'dark' || stored === 'system') ? stored : 'system';
          var resolved = theme;
          if (theme === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var root = document.documentElement;
          if (resolved === 'dark') {
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
          } else {
            root.setAttribute('data-theme', 'light');
          }
          root.style.colorScheme = resolved;
        } catch (e) { /* localStorage inacessível — ignora */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
