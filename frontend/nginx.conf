server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html names the hashed chunks of the current build, and each deploy
    # deletes the previous ones. A cached index.html therefore points at files
    # that no longer exist ("Failed to fetch dynamically imported module").
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # A missing hashed asset must 404, not fall back to index.html: served as
    # HTML it fails with a MIME error that the app cannot recognise and recover.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
